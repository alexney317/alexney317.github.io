</style></head> <body data-astro-cid-2zp6q64z> <div class="card" data-astro-cid-2zp6q64z> <p class="card__title" data-astro-cid-2zp6q64z>Feed Admin</p> <p class="card__sub" data-astro-cid-2zp6q64z>
Post a tweet to your feed. The site rebuilds automatically (~2 min after saving).
</p> <!-- GitHub Token --> <div class="field" data-astro-cid-2zp6q64z> <label for="pat" data-astro-cid-2zp6q64z>GitHub Token</label> <div class="pat-row" data-astro-cid-2zp6q64z> <input id="pat" type="password" placeholder="github_pat_…" autocomplete="off" data-astro-cid-2zp6q64z> <button class="btn btn-ghost btn-sm" id="save-pat" data-astro-cid-2zp6q64z>Save</button> </div> <p class="hint" data-astro-cid-2zp6q64z>
Use a <strong style="color:var(--text)" data-astro-cid-2zp6q64z>classic token</strong> (not fine-grained):<br data-astro-cid-2zp6q64z> <a href="https://github.com/settings/tokens/new?scopes=repo&description=Feed+Admin" target="_blank" style="color:var(--accent)" data-astro-cid-2zp6q64z>github.com/settings/tokens/new</a>
— check the <strong style="color:var(--text)" data-astro-cid-2zp6q64z>repo</strong> scope. Stored in your browser only.
</p> <p class="token-saved" id="token-saved" data-astro-cid-2zp6q64z>Token saved locally.</p> </div> <hr class="divider" data-astro-cid-2zp6q64z> <!-- Tweet URL --> <div class="field" data-astro-cid-2zp6q64z> <label for="tweet-url" data-astro-cid-2zp6q64z>Tweet / Post URL</label> <input id="tweet-url" type="url" placeholder="https://x.com/user/status/…" autocomplete="off" inputmode="url" data-astro-cid-2zp6q64z> <p class="hint" data-astro-cid-2zp6q64z>On X: tap Share → Copy Link, then paste here.</p> </div> <!-- Caption (optional) --> <div class="field" data-astro-cid-2zp6q64z> <label for="caption" data-astro-cid-2zp6q64z>Caption <span style="font-weight:400;opacity:0.6" data-astro-cid-2zp6q64z>(optional)</span></label> <textarea id="caption" placeholder="Why this is worth sharing…" data-astro-cid-2zp6q64z></textarea> </div> <button class="btn btn-primary" id="submit" data-astro-cid-2zp6q64z>Add to Feed</button> <div class="status" id="status" data-astro-cid-2zp6q64z></div> </div> <script>
      const REPO   = 'alexney317/alexney317.github.io';
      const FILE   = 'src/data/feed.json';
      const API    = `https://api.github.com/repos/${REPO}/contents/${FILE}`;

      const patInput    = document.getElementById('pat');
      const savePatBtn  = document.getElementById('save-pat');
      const tokenSaved  = document.getElementById('token-saved');
      const tweetInput  = document.getElementById('tweet-url');
      const captionInput= document.getElementById('caption');
      const submitBtn   = document.getElementById('submit');
      const statusEl    = document.getElementById('status');

      // Restore saved token
      const saved = localStorage.getItem('gh_pat');
      if (saved) {
        patInput.value = saved;
        tokenSaved.style.display = 'block';
      }

      savePatBtn.addEventListener('click', () => {
        const val = patInput.value.trim();
        if (!val) return;
        localStorage.setItem('gh_pat', val);
        tokenSaved.style.display = 'block';
      });

      submitBtn.addEventListener('click', async () => {
        const pat      = patInput.value.trim() || localStorage.getItem('gh_pat') || '';
        const tweetUrl = tweetInput.value.trim();
        const caption  = captionInput.value.trim();

        if (!pat)      { showStatus('Enter your GitHub token first.', 'error'); return; }
        if (!tweetUrl) { showStatus('Paste a tweet URL first.', 'error'); return; }

        submitBtn.disabled = true;
        showStatus('Saving to feed…', 'loading');

        try {
          await postEntry(pat, tweetUrl, caption);
          tweetInput.value = '';
          captionInput.value = '';
          showStatus('Done! Site will rebuild in ~2 minutes.', 'success');
        } catch (err) {
          showStatus(err.message, 'error');
        } finally {
          submitBtn.disabled = false;
        }
      });

      async function postEntry(pat, rawUrl, caption) {
        // Normalize x.com → twitter.com for embed compatibility
        const tweetUrl = rawUrl.replace(/^https?:\/\/x\.com/, 'https://twitter.com');

        // 1. Read current file (need SHA + content)
        const getResp = await fetch(API, {
          headers: {
            'Authorization': `token ${pat}`,
            'Accept': 'application/vnd.github+json',
          },
        });

        if (getResp.status === 401) throw new Error('Invalid token — re-enter your GitHub token.');
        if (getResp.status === 403) throw new Error('Token lacks repo access. Create a classic token at github.com/settings/tokens/new with the "repo" scope checked.');
        if (!getResp.ok)           throw new Error(`GitHub error ${getResp.status} — check your token and try again.`);

        const file    = await getResp.json();
        const current = JSON.parse(atob(file.content.replace(/\s/g, '')));

        // 2. Prepend new entry
        const entry = {
          id:       Date.now().toString(),
          date:     new Date().toISOString(),
          type:     'tweet',
          tweetUrl: tweetUrl,
          caption:  caption || null,
        };

        const updated = [entry, ...current];

        // 3. Write back via GitHub API
        const body = JSON.stringify({
          message: `Add feed entry ${new Date().toLocaleDateString('en-US')}`,
          content: btoa(unescape(encodeURIComponent(JSON.stringify(updated, null, 2)))),
          sha:     file.sha,
        });

        const putResp = await fetch(API, {
          method:  'PUT',
          headers: {
            'Authorization': `token ${pat}`,
            'Accept':        'application/vnd.github+json',
            'Content-Type':  'application/json',
          },
          body,
        });

        if (!putResp.ok) {
          const err = await putResp.json().catch(() => ({}));
          throw new Error(err.message || `GitHub API error (${putResp.status}).`);
        }
      }

      function showStatus(msg, type) {
        statusEl.textContent = msg;
        statusEl.className   = `status visible status--${type}`;
      }
    </script> </body> </html>
